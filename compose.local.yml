services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: natasha_local
      POSTGRES_USER: natasha_local
      POSTGRES_PASSWORD: natasha_local_password
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U natasha_local -d natasha_local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [local]

  api:
    build:
      context: ./backend
    env_file: .env.local
    environment:
      NODE_ENV: development
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - api_local_uploads:/app/uploads
    networks: [local]

  web:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./public_html:/usr/share/nginx/html:ro
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [local]

networks:
  local:

volumes:
  postgres_local_data:
  api_local_uploads: