server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reduce the first download on mobile networks. Static assets are already
    # versioned by Vite, so they can be cached safely for a long time.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/javascript text/plain text/xml;

    location = /sw.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /img/ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /terminos_y_condiciones.pdf {
        absolute_redirect off;
        return 301 /terminos-y-privacidad.html;
    }

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
