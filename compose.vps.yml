services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads
    expose: ["3001"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      internal: {}
      nginx_network:
        aliases: [natasha-api]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./public_html:/usr/share/nginx/html:ro
      - ./nginx.vps.conf:/etc/nginx/conf.d/default.conf:ro
    expose: ["80"]
    networks:
      internal: {}
      nginx_network:
        aliases: [natasha-web]

networks:
  internal: {}
  nginx_network:
    external: true

volumes:
  postgres_data: {}
  api_uploads: {}
